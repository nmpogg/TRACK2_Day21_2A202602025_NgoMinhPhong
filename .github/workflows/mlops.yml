name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**'
      - 'params.yaml'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:


jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}
      prev_accuracy: ${{ steps.check_prev_model.outputs.prev_accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Check previous model metrics on GCS (Bonus 4)
        id: check_prev_model
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
          BUCKET_NAME: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os, json
          from google.cloud import storage

          bucket_name = os.environ["BUCKET_NAME"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/metrics.json")

          if blob.exists():
              prev_data = json.loads(blob.download_as_text())
              prev_acc = prev_data.get("accuracy", 0.0)
              print(f"Previous production accuracy: {prev_acc:.4f}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"prev_accuracy={prev_acc}\n")
          else:
              print("No previous production model found on GCS.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("prev_accuracy=0.0\n")
          EOF

      - name: Pull data with DVC
        run: dvc pull data/train_phase1.csv data/eval.csv

      - name: Train model
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model and metrics to Cloud Storage
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
          BUCKET_NAME: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["BUCKET_NAME"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          # Upload model binary
          blob_model = bucket.blob("models/latest/model.pkl")
          blob_model.upload_from_filename("models/model.pkl")
          print(f"Uploaded models/model.pkl to gs://{bucket_name}/models/latest/model.pkl")

          # Upload metrics metadata (Bonus 4)
          blob_metrics = bucket.blob("models/latest/metrics.json")
          blob_metrics.upload_from_filename("outputs/metrics.json")
          print(f"Uploaded outputs/metrics.json to gs://{bucket_name}/models/latest/metrics.json")
          EOF

      - name: Save metrics and report as artifact (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: metrics-and-report
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.68) va chong giam sut hieu nang (Bonus 4).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate and regression (Bonus 4)
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          prev_acc = float("${{ needs.train.outputs.prev_accuracy }}")

          print(f"New Model Accuracy      : {acc:.4f}")
          print(f"Previous Model Accuracy : {prev_acc:.4f}")

          # Nguong chat luong co ban
          if acc < 0.68:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.68. Huy deploy.")

          # Bonus 4: Kiem tra chong hoi quy hieu nang
          if prev_acc > 0.0 and acc < (prev_acc - 0.02):
              raise SystemExit(f"FAILED (Regression): new accuracy {acc:.4f} < previous {prev_acc:.4f}. Huy deploy.")

          print(f"PASSED: accuracy {acc:.4f} dat yeu cau va khong bi giam sut hieu nang. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8000/health; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for server to start ($i/10)..."
              sleep 3
            done
            echo "Health check failed."
            exit 1